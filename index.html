1. El aviso siempre visible (fácil y rápido)
Para que el cartel de bienvenida aparezca cada vez que se abra la app, solo hay que eliminar la condición que lo oculta después de la primera vez. Es un cambio de una sola línea.

En tu index.html, busca este bloque (cerca del inicio del <script>):

javascript
// 1. LÓGICA DEL CARTEL DE BIENVENIDA
if (!localStorage.getItem('conversor_onboarding_seen')) {
    welcomeModal.style.display = 'flex';
}
Reemplázalo por esto:

javascript
// 1. LÓGICA DEL CARTEL DE BIENVENIDA (SIEMPRE VISIBLE)
welcomeModal.style.display = 'flex';
¿Qué pasará? Ahora, cada vez que alguien abra o recargue la app, verá el cartel explicativo. El botón "¡Entendido, empecemos!" seguirá funcionando para cerrarlo. Si en el futuro quieres que se pueda ocultar de nuevo, avísame y le añadimos un botón de "No volver a mostrar".
