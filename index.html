<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Conversor P2P — Cambia fácil</title>
    <meta name="theme-color" content="#1a1a1a">
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --accent: #22c55e; --text: #e0e0e0; --muted: #a0a0a0; --border: #333; --warn: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent;}
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .app-container { width: 100%; max-width: 400px; background-color: var(--card); border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden; border: 1px solid var(--border); }
        .header { background: linear-gradient(135deg, #1f2937, #111827); padding: 25px 20px; text-align: center; }
        .header h1 { font-size: 1.4rem; margin-bottom: 5px; color: white; }
        .header p { font-size: 0.85rem; color: var(--muted); }
        .content { padding: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
        .input-group input, .input-group select { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid var(--border); background-color: #2a2a2a; color: white; font-size: 1.1rem; outline: none; }
        .input-group input:focus, .input-group select:focus { border-color: var(--accent); }
        .row { display: flex; gap: 10px; }
        .row .input-group { flex: 1; }
        .btn-main { width: 100%; padding: 16px; border: none; border-radius: 12px; background-color: var(--accent); color: #000; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; transition: opacity 0.2s; }
        .btn-main:disabled { opacity: 0.5; cursor: not-allowed; background-color: #555; color: #aaa; }
        
        .limit-box { background-color: #2a2a2a; border-radius: 8px; padding: 10px; text-align: center; font-size: 0.8rem; color: #fbbf24; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .unlock-btn { background: transparent; border: 1px solid #fbbf24; color: #fbbf24; padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-weight: bold;}
        
        .result-card { margin-top: 20px; background-color: #0f172a; border-radius: 12px; padding: 20px; border: 1px solid #334155; display: none; }
        .result-card h2 { font-size: 0.9rem; color: var(--muted); margin-bottom: 15px; text-transform: uppercase; }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 1rem; }
        .data-row span:last-child { font-weight: 600; }
        .total-row { border-top: 1px solid #334155; padding-top: 15px; margin-top: 15px; font-size: 1.2rem; font-weight: bold; color: var(--accent); }
        .error-msg { color: var(--warn); font-size: 0.85rem; text-align: center; margin-top: 10px; display: none; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(0,0,0,0.3); border-radius: 50%; border-top-color: #000; animation: spin 1s linear infinite; margin-right: 10px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>Conversor P2P</h1>
        <p>Calcula tus USDT al instante</p>
    </div>
    <div class="content">
        
        <div class="limit-box">
            <span id="limitText">Consultas gratis: 30/30</span>
            <button class="unlock-btn" id="unlockBtn">Desbloquear VIP</button>
        </div>

        <div class="input-group">
            <label>¿Cuánto dinero quieres cambiar?</label>
            <input type="number" id="amountInput" placeholder="Ej: 11000" inputmode="decimal">
        </div>
        
        <div class="row">
            <div class="input-group">
                <label>Moneda que tienes</label>
                <select id="fromCurrency">
                    <option value="VES" selected>VES (Bolívares)</option>
                    <option value="USD">USD (Dólares)</option>
                </select>
            </div>
            <div class="input-group">
                <label>Quieres recibir</label>
                <select id="toCurrency">
                    <option value="USDT" selected>USDT</option>
                </select>
            </div>
        </div>

        <!-- EL APARTADO DE COMISIÓN HA SIDO ELIMINADO -->

        <button class="btn-main" id="calculateBtn">Calcular Tasa Real</button>
        <div id="errorMsg" class="error-msg"></div>

        <div class="result-card" id="resultCard">
            <h2>Resultado de la operación</h2>
            <div class="data-row"><span>Tasa Binance P2P:</span><span id="rateDisplay">-</span></div>
            <div class="data-row total-row"><span>Recibes:</span><span id="netDisplay">-</span></div>
        </div>
    </div>
</div>

<script>
    const amountInput = document.getElementById('amountInput');
    const fromCurrency = document.getElementById('fromCurrency');
    const calculateBtn = document.getElementById('calculateBtn');
    const errorMsg = document.getElementById('errorMsg');
    const resultCard = document.getElementById('resultCard');
    const rateDisplay = document.getElementById('rateDisplay');
    const netDisplay = document.getElementById('netDisplay');
    
    const limitText = document.getElementById('limitText');
    const unlockBtn = document.getElementById('unlockBtn');
    
    const MAX_FREE = 30;
    let queriesUsed = parseInt(localStorage.getItem('conversor_queries') || '0');
    let isPremium = localStorage.getItem('conversor_premium') === 'true';

    const MI_PROXY = "https://conversor-proxy.hehf24.workers.dev";

    function updateLimitUI() {
        if (isPremium) {
            limitText.innerHTML = "✨ <b>Modo VIP Activado</b>";
            limitText.style.color = "#22c55e";
            unlockBtn.style.display = 'none';
            calculateBtn.disabled = false;
        } else {
            let left = MAX_FREE - queriesUsed;
            limitText.innerHTML = `Consultas gratis: <b>${left}/${MAX_FREE}</b>`;
            if (left <= 0) {
                limitText.style.color = "#ef4444";
                calculateBtn.disabled = true;
                calculateBtn.textContent = "Límite alcanzado";
            }
        }
    }

    // SISTEMA DE DESBLOQUEO CONECTADO AL WORKER
    unlockBtn.addEventListener('click', async () => {
        const code = prompt("Para consultas ilimitadas, realiza tu pago por Pago Móvil o Binance Pay al 0412-0000000 (Ejemplo) y recibe tu código VIP.\n\nIngresa tu código aquí:");
        
        if (!code || code.trim() === "") return;

        unlockBtn.textContent = "Validando...";
        unlockBtn.disabled = true;

        try {
            const response = await fetch(MI_PROXY + "/validar-codigo", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ codigo: code })
            });

            const data = await response.json();

            if (data.valido) {
                isPremium = true;
                localStorage.setItem('conversor_premium', 'true');
                alert("¡Código correcto! Bienvenido al modo VIP. Ahora tienes consultas ilimitadas.");
                updateLimitUI();
            } else {
                alert("Código inválido o ya utilizado. Verifica con el administrador.");
            }
        } catch (error) {
            alert("Error de conexión al validar el código. Intenta de nuevo.");
        } finally {
            unlockBtn.textContent = "Desbloquear VIP";
            unlockBtn.disabled = false;
        }
    });

    calculateBtn.addEventListener('click', async () => {
        if (queriesUsed >= MAX_FREE && !isPremium) return;

        const amount = parseFloat(amountInput.value);
        const currency = fromCurrency.value;

        if (!amount || amount <= 0) {
            errorMsg.textContent = "Por favor, ingresa un monto válido.";
            errorMsg.style.display = 'block';
            return;
        }

        errorMsg.style.display = 'none';
        resultCard.style.display = 'none';
        calculateBtn.disabled = true;
        calculateBtn.innerHTML = '<span class="spinner"></span> Buscando...';

        try {
            // Petición a la ruta principal del Worker (la de las tasas)
            const response = await fetch(MI_PROXY);
            if (!response.ok) throw new Error("Error en puente");
            
            const data = await response.json();
            const binanceRate = data.rates.find(r => r.market && r.market.toLowerCase().includes('binance'));
            
            if (!binanceRate || !binanceRate.ask) throw new Error("No hay tasa");

            const rate = binanceRate.ask;
            let grossUSDT = currency === 'VES' ? (amount / rate) : amount;

            rateDisplay.textContent = currency === 'VES' ? `1 USDT = ${rate.toFixed(2)} VES` : `1 USDT ≈ 1 USD`;
            netDisplay.textContent = `${grossUSDT.toFixed(2)} USDT`;

            resultCard.style.display = 'block';

            if (!isPremium) {
                queriesUsed++;
                localStorage.setItem('conversor_queries', queriesUsed);
                updateLimitUI();
            }

        } catch (error) {
            errorMsg.textContent = "Error de conexión. Intenta de nuevo.";
            errorMsg.style.display = 'block';
        } finally {
            if (queriesUsed < MAX_FREE || isPremium) {
                calculateBtn.disabled = false;
                calculateBtn.textContent = 'Calcular Tasa Real';
            }
        }
    });

    updateLimitUI();
</script>
</body>
</html>
